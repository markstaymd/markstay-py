name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Python 3.9 is not built for ubuntu-latest (26.04); pin the runner that has it.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[commonmark]" pytest
      - run: pytest -q
